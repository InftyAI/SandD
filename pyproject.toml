[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sandd"
version = "0.0.1"
description = "A lightweight sandbox daemon for secure agent execution in isolated environments."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "InftyAI", email = "contact@inftyai.com"}
]
keywords = ["agent", "daemon", "sandbox"]
dependencies = []

[project.urls]
Homepage = "https://github.com/InftyAI/SandD"
Repository = "https://github.com/InftyAI/SandD"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.0",
]

[tool.maturin]
module-name = "sandd._core"
python-source = "python"
manifest-path = "server/Cargo.toml"
features = ["pyo3/extension-module"]
include = [
    "server/**/*",
    "python/**/*",
    "README.md",
    "LICENSE",
]
exclude = [
    "Cargo.toml",
    "/sandd",        # Only exclude root sandd/ directory (Rust daemon source)
    "target/**/*",
    ".git/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests with Docker (slow, skip by default)",
]
