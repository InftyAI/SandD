[package]
name = "sandbox-server"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "A lightweight sandbox daemon for secure agent execution in isolated environments."
repository = "https://github.com/InftyAI/SandD"
homepage = "https://github.com/InftyAI/SandD"

[lib]
name = "sandbox_server"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-tungstenite = "0.24"

# Async utilities
futures = "0.3"
futures-util = "0.3"

# Concurrent data structures
dashmap = "6.1"
parking_lot = "0.12"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "anyhow"] }

# Base64 for protocol
base64 = "0.22"

[features]
default = []
