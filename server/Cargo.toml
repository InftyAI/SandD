[package]
name = "sandbox-server"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "A lightweight sandbox daemon for secure agent execution in isolated environments."
repository = "https://github.com/InftyAI/SandD"
homepage = "https://github.com/InftyAI/SandD"

[lib]
name = "sandbox_server"
crate-type = ["cdylib", "rlib"]

[dependencies]
sandd-protocol = { path = "../protocol" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-tungstenite = "0.24"

# Async utilities
futures = "0.3"
futures-util = "0.3"

# Concurrent data structures
dashmap = "6.1"
parking_lot = "0.12"

# Python bindings, OPTIONAL — pulled in only by the `python` feature (see
# [features] below). With extension-module set, pyo3 deliberately leaves the CPython
# symbols undefined for an interpreter to supply at dlopen time, so a plain `cargo
# test` linking it would fail (loudly on macOS, subtly elsewhere).
pyo3 = { version = "0.20", features = ["extension-module", "anyhow", "abi3-py38"], optional = true }
pythonize = { version = "0.20", optional = true }

# Base64 for protocol
base64 = "0.22"

[features]
# OFF by default so `cargo build`/`cargo test` work with no interpreter in sight —
# that is what CI and `make test` run.
#
# maturin turns it on (pyproject.toml [tool.maturin] features) when building the
# wheel, which is the only build that wants the extension module.
default = []
python = ["pyo3", "pythonize"]
