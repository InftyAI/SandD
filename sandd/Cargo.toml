[package]
name = "sandd"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "A lightweight sandbox daemon for secure agent execution in isolated environments."
repository = "https://github.com/InftyAI/SandD"
homepage = "https://github.com/InftyAI/SandD"
documentation = "https://github.com/InftyAI/SandD/tree/main/docs"
readme = "../README.md"
keywords = ["agent", "daemon", "sandbox"]
categories = ["command-line-utilities"]

[[bin]]
name = "sandd"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# WebSocket client
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Process execution
tokio-process = "0.2"

# PTY support
portable-pty = "0.8"

# System info
sysinfo = "0.32"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# File I/O
tokio-util = { version = "0.7", features = ["io"] }

# Base64 for protocol
base64 = "0.22"
